<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1612" />
    <title>Pas de connexion — MYRESTO</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1f1612;
        background: radial-gradient(60rem 38rem at 8% -8%, #ffdcc7, transparent 62%), radial-gradient(50rem 38rem at 98% 2%, #ffecc2, transparent 58%), #faf5f0;
      }
      main { max-width: 22rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 12px 28px -10px rgba(150, 70, 30, 0.5); }
      h1 { margin: 20px 0 8px; font-size: 1.6rem; letter-spacing: -0.02em; }
      p { margin: 0; color: #7a6a60; line-height: 1.5; }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 14px 28px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #1f1612;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #f7f0ea; background: #14100d; }
        p { color: #aa9d92; }
        button { color: #1f1612; background: #f7f0ea; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Pas de connexion</h1>
      <p>MYRESTO a besoin d'internet pour afficher tes réservations et ton planning à jour. Vérifie ton réseau, puis réessaie.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
